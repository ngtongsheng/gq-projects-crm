name: Backup prod

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  # migrate-prod runs this first so every migration has a fresh restore point.
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_PROD_PROJECT_REF:
        required: true
      SUPABASE_PROD_DB_PASSWORD:
        required: true

permissions:
  contents: read

# Never cancel a dump halfway through.
concurrency:
  group: backup-prod
  cancel-in-progress: false

jobs:
  backup-prod:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
      - name: Dump schema and data
        run: |
          mkdir backup
          pnpm exec supabase db dump --linked --file backup/schema.sql
          pnpm exec supabase db dump --linked --data-only --file backup/data.sql
      # The repo is private, so only collaborators can download the dump.
      - uses: actions/upload-artifact@v7
        with:
          name: prod-backup
          path: backup/
          retention-days: 30
          if-no-files-found: error
