name: Checks

on:
  pull_request:
    # labeled/unlabeled re-run the guard after the owner adds `owner-approved`.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migration-guard:
    runs-on: ubuntu-latest
    steps:
      # Full history so `origin/main...HEAD` resolves in the guard script.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: pnpm guard:migrations
        env:
          OWNER_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'owner-approved') }}

  migrate-dev:
    needs: migration-guard
    runs-on: ubuntu-latest
    # The dev database is shared by every open PR; never run two pushes at once
    # and never cancel one halfway through.
    concurrency:
      group: migrate-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect migration changes
        id: migrations
        run: |
          if git diff --name-only origin/main...HEAD -- supabase/migrations | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed; nothing to apply to dev."
          fi
      - if: steps.migrations.outputs.changed == 'true'
        uses: jdx/mise-action@v5
      - if: steps.migrations.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.migrations.outputs.changed == 'true'
        run: pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
      - if: steps.migrations.outputs.changed == 'true'
        run: pnpm exec supabase db push --yes
