<style>
[hidden]{display:none!important}
/* Layout: navy brand header with logo, mint tab marker; one working column of white panels on a cool grey ground */
:root{
  /* GQ Projects brand: mint #3AE6C0 and navy #233343 from the logo */
  --bg:#f3f6f8; --surface:#ffffff; --sunk:#eaeff2; --line:#d7dfe5;
  --fg:#1c2a38; --muted:#5b6a79; --accent:#233343; --accent-fg:#ffffff; --accent-soft:#dbf8f1;
  --mint:#3ae6c0; --mint-ink:#0d7a63; --head-bg:#233343; --head-fg:#ffffff; --head-muted:#a9b8c6;
  --good:#1e7a3c; --good-bg:#e1f3e6; --info:#2558a8; --info-bg:#e3ecfa; --warn:#9a5a00; --warn-bg:#fbefd6;
  --bad:#b03a2e; --bad-bg:#fbe3df; --neutral:#566573; --neutral-bg:#e9eef2;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"Saira","Figtree",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#16222d; --sunk:#1d2b38; --line:#2a3b4a;
  --fg:#e5edf3; --muted:#98a8b6; --accent:#3ae6c0; --accent-fg:#10202a; --accent-soft:#143a36;
  --mint:#3ae6c0; --mint-ink:#5ef0cf; --head-bg:#0b131a; --head-fg:#ffffff; --head-muted:#8fa1b1;
  --good:#7fd69a; --good-bg:#16321f; --info:#8db4f0; --info-bg:#1a2944; --warn:#f0bd6a; --warn-bg:#3a2c12;
  --bad:#f2928a; --bad-bg:#3d1c19; --neutral:#a7b4bf; --neutral-bg:#24323f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#16222d; --sunk:#1d2b38; --line:#2a3b4a;
  --fg:#e5edf3; --muted:#98a8b6; --accent:#3ae6c0; --accent-fg:#10202a; --accent-soft:#143a36;
  --mint:#3ae6c0; --mint-ink:#5ef0cf; --head-bg:#0b131a; --head-fg:#ffffff; --head-muted:#8fa1b1;
  --good:#7fd69a; --good-bg:#16321f; --info:#8db4f0; --info-bg:#1a2944; --warn:#f0bd6a; --warn-bg:#3a2c12;
  --bad:#f2928a; --bad-bg:#3d1c19; --neutral:#a7b4bf; --neutral-bg:#24323f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-fg);border-bottom:3px solid var(--mint)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{height:34px;width:auto;flex:none}
.brand .nm{font-family:var(--font-head);font-weight:700;font-size:19px;letter-spacing:.06em;line-height:1.1;text-transform:uppercase}
.brand .nm b{color:var(--mint);font-weight:700}
.brand small{display:block;font-family:var(--font-ui);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--head-muted)}
header .who label{color:var(--head-muted)}
header select{background:var(--surface);color:var(--fg)}
header .btn{background:transparent;color:var(--head-fg);border-color:var(--head-muted)}
header .tab{color:var(--head-muted)}
header .tab:hover{color:var(--head-fg)}
.who{display:flex;align-items:center;gap:8px}
.who label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.who{min-width:0;flex:0 1 auto}.who select{min-width:0;width:100%}
@media (max-width:520px){.who{flex:1 1 100%}}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--head-fg);border-color:var(--mint)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:11px;line-height:18px;text-align:center}
main{padding-block:18px 40px;display:grid;gap:16px}
h1.page{font-family:var(--font-head);font-weight:600;font-size:25px;letter-spacing:.01em;margin:0;text-wrap:balance}
.pagehead{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pagehead .grow{margin-right:auto}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:10px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--fg)} .banner.bad{background:var(--bad-bg)} .banner.info{background:var(--accent-soft)}
.banner .grow{flex:1 1 240px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.panel-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-family:var(--font-head);font-weight:600;font-size:17px;margin:0;margin-right:auto}
.panel-body{padding:14px 16px}
.count{font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 14px;background:var(--sunk);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.num{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.b{font-weight:600}
.sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.pill.good{color:var(--good);background:var(--good-bg)} .pill.info{color:var(--info);background:var(--info-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.bad{color:var(--bad);background:var(--bad-bg)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start}
@media (max-width:520px){.brand small{display:none}.brand img{height:28px}.brand .nm{font-size:17px}}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-size:23px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted)}
.tile .s{font-size:12.5px;color:var(--muted)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--sunk);min-width:90px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--good)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.barcell{display:grid;gap:5px;min-width:130px}
.g32{display:grid;gap:16px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}@media (max-width:900px){.g32{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.list{display:grid}
.item{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;display:grid;gap:1px}
.chip[aria-pressed="true"]{border-color:var(--mint-ink);background:var(--accent-soft)}
.chip .b{font-size:14px} .chip .sub{font-size:12px}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line)}
.day{background:var(--surface);min-height:150px;display:grid;align-content:start;gap:6px;padding:8px}
.day.wkend{background:var(--sunk)}
.dayhead{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted)}
.dayhead .d{font-family:var(--font-num);font-size:15px;color:var(--fg)}
.day.today .dayhead .d{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 6px}
.ev{font:inherit;text-align:left;border:1px solid var(--line);border-left:3px solid var(--info);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 7px;cursor:pointer;display:grid;gap:1px;font-size:12.5px;min-width:0}
.ev.Completed{border-left-color:var(--good)} .ev.Cancelled{border-left-color:var(--neutral);opacity:.6;text-decoration:line-through}
.ev .t{font-family:var(--font-num);font-size:11.5px;color:var(--muted)}
.ev .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addday{font:inherit;font-size:12px;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:6px;padding:3px;cursor:pointer}
@media (max-width:900px){.week{grid-template-columns:1fr}.day{min-height:0}.day.wkend:not(.has){display:none}}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding:14px 16px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--sunk);border-radius:10px;padding:8px;display:grid;gap:8px}
.colhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;padding:2px 4px}
.colhead span{font-family:var(--font-num);font-weight:500;color:var(--muted)}
.card{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 10px;cursor:pointer;display:grid;gap:4px}
.card .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.stale{color:var(--bad);font-weight:600}
/* report */
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:130px;padding-top:10px}
.wk{display:grid;gap:4px;justify-items:center;align-self:end;font-size:12px;color:var(--muted)}
.wk i{display:block;width:100%;max-width:56px;background:var(--mint);border-radius:4px 4px 0 0}
.wk b{font-family:var(--font-num);color:var(--fg);font-weight:500}
.fieldset{display:grid;gap:12px}
.ro{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px;min-height:20px}
ol.top3{margin:0;padding-left:20px;display:grid;gap:4px}
/* dialog */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--surface);color:var(--fg);border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-family:var(--font-head);font-weight:600;font-size:20px}
.hint{margin:0 0 12px;font-size:13px;color:var(--muted)}
.form{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%}
.field input[type=checkbox]{width:auto;margin-right:6px}
.decl{display:flex;gap:10px;align-items:flex-start;font-size:14px}.decl input{margin-top:3px;flex:none}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.msg{border-radius:8px;padding:9px 11px;font-size:13.5px}
.msg.bad{background:var(--bad-bg)} .msg.good{background:var(--good-bg)} .msg.warn{background:var(--warn-bg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sec{margin-top:16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.hist{display:grid;gap:6px;margin-top:6px;font-size:13.5px}
.hist div{border-left:2px solid var(--line);padding-left:10px}
body.ro [data-act=addCust],body.ro [data-act=addAct],body.ro [data-act=addProj],body.ro [data-act=owner],body.ro [data-act=request],body.ro [data-act=targets],body.ro [data-act=approveOT]:not(#x),body.ro [data-act=reviewRep],body.ro #rnote,body.ro [data-act=addLog],body.ro [data-act=addRet],body.ro [data-act=addInst],body.ro [data-act=addBook],body.ro [data-act=addIPO],body.ro [data-act=reqCust],body.ro .addday,body.ro [data-act=doneAct],body.ro [data-act=addOT],body.ro [data-act=commRule],body.ro [data-act=coEdit],body.ro [data-act=coPaste],body.ro [data-act=coDel],body.ro [data-act=dupOk],body.ro [data-act=shotSave],body.ro [data-act=measRecv],body.ro [data-act=team]{display:none!important}
table.full th,table.full td{white-space:nowrap;padding:8px 12px}table.full td{max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.full th:first-child,table.full td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600}table.full thead th{position:sticky;top:0;z-index:2}table.full thead th:first-child{z-index:3;background:var(--sunk)}
table.full tr.totrow td{background:var(--sunk);border-top:2px solid var(--line)}
table.full.edit td{padding:4px 6px}table.full td.gc{overflow:visible;max-width:none}table.full .gcell{padding:5px 7px;font-size:13.5px;border-radius:6px}
table.full td.calc{background:var(--sunk);color:var(--muted)}table.full tr.draft td{background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30}
@media (max-width:700px){.hide-sm{display:none}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style>

const itemsOf=p=>p.items&&p.items.length?p.items:(p.product?[{product:p.product,stock:p.stock||"",supplier:"",qty:p.qty||"",unit:"m²",m2:p.unijoy||""}]:[]);
const uniq=a=>[...new Set(a.filter(Boolean))];
const prodSum=p=>uniq(itemsOf(p).map(i=>i.product)).join(" + ");
const stockSum=p=>uniq(itemsOf(p).map(i=>i.stock)).join(" + ");
const BIG_M2=1000;
const m2Of=i=>i.unit==="m²"?+i.qty||0:i.unit==="sqft"?(+i.qty||0)/10.764:0;
const autoTrack=p=>itemsOf(p).some(i=>/indent|custom/i.test(i.stock||""))||itemsOf(p).reduce((t,i)=>t+m2Of(i),0)>=BIG_M2;
const trackReason=p=>{const I=itemsOf(p),r=[];if(I.some(i=>/indent/i.test(i.stock||"")))r.push("indent");if(I.some(i=>/custom/i.test(i.stock||"")))r.push("custom made");if(I.reduce((t,i)=>t+m2Of(i),0)>=BIG_M2)r.push("big order");return r.join(", ")};
const needsTrack=p=>p.trackPO!=null?p.trackPO:autoTrack(p);
const poFull=x=>{if(!x.poNo)return "—";const p=projById(x.pid);return (p&&p.mof||"")+x.poNo};
function nextPO(){const n=(db.pos||[]).filter(x=>/^\d{4}$/.test(x.poNo||"")).map(x=>+x.poNo);return n.length?String(Math.max(...n)+1):""}
const doFull=i=>{if(!i.doNo)return "—";const p=projById(i.pid);return (p&&p.mof||"")+i.doNo};
function nextDO(){const n=db.installs.filter(i=>i.type==="Delivery"&&/^\d{4}$/.test(i.doNo||"")).map(i=>+i.doNo);return n.length?String(Math.max(...n)+1):""}
const delsOf=p=>db.installs.filter(i=>i.pid===p.id&&i.type==="Delivery"&&i.status!=="Postponed");
function delStatus(p){const D2=delsOf(p),done=D2.filter(i=>i.status==="Done");
  if(done.some(i=>i.final))return {k:"Fully delivered",cls:"good",n:done.length};
  if(done.length)return {k:`Partially delivered (${done.length} DO${done.length>1?"s":""})`,cls:"warn",n:done.length};
  if(D2.length)return {k:"Delivery scheduled",cls:"info",n:0};return {k:"Not delivered",cls:"",n:0}}
const delPill=p=>{const d=delStatus(p);return `<span class="pill ${d.cls}">${esc(d.k)}</span>`};

function custRows(){
  const q=S.q.toLowerCase(),qd=S.q.replace(/\D/g,"");
  return db.contacts.filter(seeContact).filter(c=>{
    if(isMgr()&&S.fWho!=="All"&&!c.owners.includes(S.fWho))return false;
    if(S.fType!=="All"&&coType(c)!==S.fType)return false;
    if(S.fStatus==="inactive"&&health(c)!=="inactive")return false;
    if(S.fStatus==="due"&&health(c)==="active")return false;
    if(S.fStatus==="shared"&&c.owners.length<2)return false;
    if(S.fStatus==="new"&&MK(c.createdAt)!==CUR)return false;
    if(q&&!(c.company+" "+c.name).toLowerCase().includes(q)&&!(qd.length>=3&&c.phone.includes(qd)))return false;
    return true}).sort((a,b)=>a.company.localeCompare(b.company)||a.name.localeCompare(b.name));
}

/* ================= COMMISSION ================= */
const paid=p=>(p.payments||[]).reduce((t,x)=>t+x.amount,0);
const r2=v=>Math.round(v*100)/100;
const RULE=()=>{const r=db.commRule||{};return {low:r.low??.30,none:r.none??.20,ownLow:r.ownLow??.015,otherLow:r.otherLow??.01,high:r.high??.45,bonus:r.bonus??.01,late1:r.late1??90,cut1:r.cut1??.25,late2:r.late2??120,cut2:r.cut2??.5}};
/* late collection: commission on money received more than 90 / 120 days after the invoice date is cut 25% / 50% */
const invStart=p=>p.invDate||p.wonAt;
const lateCut=(p,date)=>{const R=RULE(),d=diffDays(date,invStart(p));return d>R.late2?R.cut2:d>R.late1?R.cut1:0};
const marginOf=p=>p.cost&&inv(p)?(inv(p)-p.cost)/inv(p):null;
const pc1=r=>(Math.round(r*1000)/10)+"%";
function commLines(p){
  const R=RULE(),mg=marginOf(p),tier=mg==null?"ok":mg<R.none?"none":mg<R.low?"low":mg>R.high?"high":"ok";
  const base=ACCT[p.acct].rate,rec=paid(p),pct=inv(p)?Math.min(1,rec/inv(p)):0,ready=pct>=.9;
  const owners=p.support&&p.support!==p.passedBy?[p.pic,p.support]:[p.pic];
  const NO_COMM=["Eddie"],FLAT={Vanessa:.01};
  const adj=(r,who)=>tier==="none"?0:tier==="low"?Math.min(r,FLAT[who]!=null?FLAT[who]:p.acct==="own"?R.ownLow:R.otherLow):tier==="high"&&FLAT[who]==null?r+R.bonus:r;
  const note=tier==="none"?` · margin below ${pc1(R.none)}: no commission`:tier==="low"?` · low margin`:tier==="high"?` · high margin bonus +${pc1(R.bonus)}`:"";
  const L=owners.filter(w=>!NO_COMM.includes(w)).map(w=>{const r0=FLAT[w]??base,r=adj(r0,w);
    return {who:w,rate:r,rule:`${FLAT[w]!=null?w+" flat "+pc1(r):ACCT[p.acct].label+" "+pc1(r)}${r!==r0&&(tier==="low"||tier==="high")?" (was "+pc1(r0)+")":""}${owners.length>1?" · ½ share":""}${tier==="high"&&FLAT[w]!=null?"":note}`,full:inv(p)*r/owners.length}});
  if(p.passedBy==="Vanessa"&&!owners.includes("Vanessa")){const r=adj(.01,"Vanessa");L.push({who:"Vanessa",rate:r,rule:`BD overlap ${pc1(r)}${note}`,full:inv(p)*r})}
  L.forEach(l=>{l.p=p;l.rec=rec;l.pct=pct;l.ready=ready;l.low=tier==="low"||tier==="none";l.tier=tier;l.mg=mg;
    l.claimed=(p.claims||[]).filter(c=>c.who===l.who).reduce((t,c)=>t+c.amount,0);
    const iv=inv(p)||1;l.lost=r2((p.payments||[]).reduce((t,y)=>t+Math.min(1,y.amount/iv)*l.full*lateCut(p,y.date),0));
    l.earned=l.full*pct-l.lost;l.claimable=ready?Math.max(0,r2(l.earned-l.claimed)):0;l.balance=Math.max(0,r2(l.full-l.lost-l.claimed));
    const od=pct<1?diffDays(TODAY,invStart(p)):0,R2=RULE();l.overdue=od;l.nextCut=pct<1?(od>R2.late2?R2.cut2:od>R2.late1?R2.cut1:0):0;l.daysToCut=pct<1&&od<=R2.late2?(od<=R2.late1?R2.late1-od:R2.late2-od):null});
  return L;
}
function commState(l){
  if(l.balance<1)return `<span class="pill good">Fully claimed</span>`;
  if(l.claimable>=1)return `<span class="pill info">Ready to claim</span>`;
  if(!l.ready)return `<span class="pill warn">Waiting · ${Math.round(l.pct*100)}% paid</span>`;
  return `<span class="pill">Claimed to date · rest after final payment</span>`;
}
function payBar(pct){const cls=pct>=.9?"":pct>=.5?"warn":"bad";return `<div class="bar ${cls}" title="90% mark"><i style="width:${pct*100}%"></i><b style="left:90%"></b></div>`}

  </div>
  ${allMoney()?`<section class="panel"><div class="panel-head"><h2>By person</h2><span class="count">Tap a name to filter</span></div><div class="scroll"><table><thead><tr><th>Name</th><th class="num">Total commission</th><th class="num">Claimed</th><th class="num">Ready to claim</th><th class="num">Waiting for payment</th></tr></thead><tbody>

  <section class="panel"><div class="panel-head"><h2>${allMoney()&&S.fWho!=="All"?S.fWho+" · ":""}Awarded projects</h2><span class="count">${lines.length} lines</span>${allMoney()&&S.fWho!=="All"?`<button class="btn small ghost" data-act="cWho" data-n="${S.fWho}">Show everyone</button>`:""}</div>

function sheetPay(id){

  openSheet(`<h3>${esc(p.mof||"")} · ${esc(p.name)}</h3><p class="hint">${esc(p.company)} · ${p.pic}${p.support?" + "+p.support:""} · invoice ${RM(inv(p))} · received ${RM(rec)} (${Math.round(rec/inv(p)*100)}%) · outstanding ${RM(Math.max(0,inv(p)-rec))}</p>

    ${edit?`<form class="form" id="f"><div class="row2"><label class="field"><span>Amount received (RM) *</span><input id="pa" type="number" min="1" step="0.01" inputmode="decimal" required value="${Math.max(0,inv(p)-rec)||""}"></label>

      <div class="row2"><label class="field"><span>Note</span><input id="pn" placeholder="e.g. Progress payment, cheque no."></label><label class="field"><span>Total invoice (RM)</span><input id="pi" type="number" min="1" step="0.01" value="${inv(p)}"></label></div>
      <div id="m"></div>${btnRow("Save payment")}</form>`:`<div class="actions"><button class="btn" data-act="close">Close</button></div>`}`);
  if(!edit)return;
  const total=()=>+val("pi")||inv(p);
  const upd=()=>{const pct=(rec+(+val("pa")||0))/total();msg("m",pct>=.9?"good":"warn",`After this payment: ${Math.round(pct*100)}% received. ${pct>=.9?"Commission can be claimed.":"Commission opens at 90%."}`)};
  ["pa","pi"].forEach(i=>document.getElementById(i).addEventListener("input",upd));upd();
  document.getElementById("f").onsubmit=e=>{e.preventDefault();const amt=+val("pa");if(!(amt>0))return msg("m","bad","Enter the amount received.");

}

function monthSel(id,val){
  const ms=[];let m=CUR;for(let i=0;i<6;i++){ms.push(m);m=prevM(m)}
  return `<select id="${id}" aria-label="Month">${ms.map(x=>`<option value="${x}" ${x===val?"selected":""}>${mName(x)}</option>`).join("")}</select>`;

const joinOf=n=>(db.joins||{})[n]||"";
/* yearly target; in the year someone joins, only the part of the year after the join date counts */
const annualFull=(k,y=CUR.slice(0,4))=>+((db.salesTargets||{})[y]||{})[k]||0;
const annualT=(k,y=CUR.slice(0,4))=>{const t=annualFull(k,y),j=joinOf(k);if(!t||!j||j.slice(0,4)!==String(y))return j&&j.slice(0,4)>String(y)?0:t;const d=diffDays(y+"-12-31",j)+1;return Math.round(t*d/365)};
const joinNote=(n,y=CUR.slice(0,4))=>{const j=joinOf(n);return !j?"":j>TODAY?`Joins ${fmtD(j)}`:j.slice(0,4)===String(y)?`Joined ${fmtD(j)}`:""};
function visitT(who,m){const b=db.targets[who]??50,j=joinOf(who);if(!j)return b;if(MK(j)>m)return 0;if(MK(j)<m)return b;const all=workdays(m),before=workdays(m,addDays(j,-1));return Math.round(b*(all-before)/all)}
function salesNums(m,filter){
  const won=db.projects.filter(p=>p.stage==="Awarded"&&p.regStage!=="Cancelled"&&p.wonAt&&filter(p)),y=m.slice(0,4);

const projKey=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();

  const live=db.projects.filter(p=>p.id!==exceptId&&p.stage!=="Lost"&&p.regStage!=="Cancelled");
  const exact=live.filter(p=>projKey(p.name).replace(/ /g,"")===kc);
  const similar=live.filter(p=>{if(exact.includes(p))return false;const pk=projKey(p.name),pc=pk.replace(/ /g,"");if(kc.length>=6&&pc.length>=6&&(pc.includes(kc)||kc.includes(pc)))return true;
    const B=new Set(pk.split(" ").filter(w=>w.length>1));let n=0;A.forEach(w=>{if(B.has(w))n++});return n>=2&&n/Math.min(A.size,B.size)>=.6});
  return {exact,similar}}
