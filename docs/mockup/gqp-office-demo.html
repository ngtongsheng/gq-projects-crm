<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GQ CRM with Costing</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
[hidden]{display:none!important}
/* Layout: navy brand header with logo, mint tab marker; one working column of white panels on a cool grey ground */
:root{
  /* GQ Projects brand: mint #3AE6C0 and navy #233343 from the logo */
  --bg:#f3f6f8; --surface:#ffffff; --sunk:#eaeff2; --line:#d7dfe5;
  --fg:#1c2a38; --muted:#5b6a79; --accent:#233343; --accent-fg:#ffffff; --accent-soft:#dbf8f1;
  --mint:#3ae6c0; --mint-ink:#0d7a63; --head-bg:#233343; --head-fg:#ffffff; --head-muted:#a9b8c6;
  --good:#1e7a3c; --good-bg:#e1f3e6; --info:#2558a8; --info-bg:#e3ecfa; --warn:#9a5a00; --warn-bg:#fbefd6;
  --bad:#b03a2e; --bad-bg:#fbe3df; --neutral:#566573; --neutral-bg:#e9eef2;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"Saira","Figtree",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#16222d; --sunk:#1d2b38; --line:#2a3b4a;
  --fg:#e5edf3; --muted:#98a8b6; --accent:#3ae6c0; --accent-fg:#10202a; --accent-soft:#143a36;
  --mint:#3ae6c0; --mint-ink:#5ef0cf; --head-bg:#0b131a; --head-fg:#ffffff; --head-muted:#8fa1b1;
  --good:#7fd69a; --good-bg:#16321f; --info:#8db4f0; --info-bg:#1a2944; --warn:#f0bd6a; --warn-bg:#3a2c12;
  --bad:#f2928a; --bad-bg:#3d1c19; --neutral:#a7b4bf; --neutral-bg:#24323f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#16222d; --sunk:#1d2b38; --line:#2a3b4a;
  --fg:#e5edf3; --muted:#98a8b6; --accent:#3ae6c0; --accent-fg:#10202a; --accent-soft:#143a36;
  --mint:#3ae6c0; --mint-ink:#5ef0cf; --head-bg:#0b131a; --head-fg:#ffffff; --head-muted:#8fa1b1;
  --good:#7fd69a; --good-bg:#16321f; --info:#8db4f0; --info-bg:#1a2944; --warn:#f0bd6a; --warn-bg:#3a2c12;
  --bad:#f2928a; --bad-bg:#3d1c19; --neutral:#a7b4bf; --neutral-bg:#24323f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-fg);border-bottom:3px solid var(--mint)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 4px}

.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:11px;line-height:18px;text-align:center}
#main{padding-block:18px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
h1.page{font-family:var(--font-head);font-weight:600;font-size:25px;letter-spacing:.01em;margin:0;text-wrap:balance}
.pagehead{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}

.banner .grow{flex:1 1 240px}

.panel-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}

.btn:hover{border-color:var(--muted)}

.btn.danger{color:var(--bad)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 14px;background:var(--sunk);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.num{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.b{font-weight:600}
.sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.pill.good{color:var(--good);background:var(--good-bg)} .pill.info{color:var(--info);background:var(--info-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.bad{color:var(--bad);background:var(--bad-bg)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start}
@media (max-width:520px){.brand small{display:none}.brand img{height:28px}.brand .nm{font-size:17px}}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-size:23px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted)}
.tile .s{font-size:12.5px;color:var(--muted)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--sunk);min-width:90px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--good)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.barcell{display:grid;gap:5px;min-width:130px}
.g32{display:grid;gap:16px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}@media (max-width:900px){.g32{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.list{display:grid}
.item{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;display:grid;gap:1px}
.chip[aria-pressed="true"]{border-color:var(--mint-ink);background:var(--accent-soft)}
.chip .b{font-size:14px} .chip .sub{font-size:12px}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line)}
.day{background:var(--surface);min-height:150px;display:grid;align-content:start;gap:6px;padding:8px}
.day.wkend{background:var(--sunk)}
.dayhead{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted)}
.dayhead .d{font-family:var(--font-num);font-size:15px;color:var(--fg)}
.day.today .dayhead .d{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 6px}
.ev{font:inherit;text-align:left;border:1px solid var(--line);border-left:3px solid var(--info);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 7px;cursor:pointer;display:grid;gap:1px;font-size:12.5px;min-width:0}
#doW,#doW .field,#dolines{min-width:0;max-width:100%} #dolines{display:grid;gap:8px}
.doln{display:grid;grid-template-columns:130px 1fr 1.4fr 80px 90px;gap:6px;padding:8px;border:1px solid var(--line);border-radius:10px} .doln input,.doln select{min-width:0;font-size:13px;padding:7px 8px} .doln [data-f="cov"]{grid-column:1/3} .doln [data-f="batch"]{grid-column:3/5}
@media (max-width:640px){.doln{grid-template-columns:1fr 1fr} .doln .w2,.doln [data-f="cov"],.doln [data-f="batch"]{grid-column:1/-1}} #dolines .scroll{max-width:100%}
#doPrint{position:fixed;inset:0;z-index:300;overflow:auto;background:#5b6470}
.fmTight .srt td,.fmTight .srt th{padding:2px 7px;font-size:11.5px;line-height:1.3}.fmTight div{line-height:1.3}.fmTight>div[style*="background:#ddd"]{margin-top:8px!important;padding:3px 8px!important}.fmTight h2{margin-bottom:6px!important}
.repPrint{font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.repPrint .pill{padding:0 5px;font-size:9.5px;line-height:1.5}.repPrint .sub{font-size:9.5px}.repPrint .itin td{padding:3px 5px!important}.repPrint .pagehead{margin:0 0 8px}.repPrint h1.page{font-size:18px;margin:0}.repPrint .panel{border:1px solid #bbb;border-radius:6px;margin:0 0 10px;box-shadow:none;break-inside:auto}.repPrint .panel-head{padding:6px 10px;border-bottom:1px solid #ccc}.repPrint .panel-head h2{font-size:13px}
.repPrint .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}.repPrint .tile{border:1px solid #bbb;border-radius:6px;padding:6px 8px;box-shadow:none}.repPrint .tile .v{font-size:18px}.repPrint table{font-size:10.5px}.repPrint td,.repPrint th{padding:4px 6px!important}.repPrint tr{break-inside:avoid}.repPrint .scroll{max-height:none!important;overflow:visible!important}
.repPrint .ro,.repPrint .printval{border:1px solid #ccc;border-radius:4px;padding:5px 7px;min-height:18px;white-space:pre-wrap}.repPrint .pill{border:1px solid #999}.repPrint .grid2{display:grid;grid-template-columns:1fr 1fr}
.itin tr.dayfirst td{border-top:2px solid var(--line)}
.vycol table td{padding:6px 4px;font-size:13px}.vycol table{width:100%}.vysum td.num{white-space:normal}
.srpage{font-family:Arial,Helvetica,sans-serif;color:#000}.srt{width:100%;border-collapse:collapse;font-size:13px}.srt td,.srt th{border:1px solid #000;padding:6px 8px;vertical-align:top;text-align:left}.srt .lb{width:22%;background:#f3f3f3}.srt .lb span{font-size:12px}.sri th{text-align:center;font-weight:600}.srpage .srt th{color:#000;text-transform:none;letter-spacing:0;font-size:12px;background:#fff}.srpage .srt th[colspan]{text-align:center;background:#bbb}.srsig td{border:0!important;background:#fff!important}.sri td{height:34px;vertical-align:middle;text-align:center}
.dobar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)} .dobar .grow{flex:1}
.dopage{width:210mm;max-width:calc(100% - 16px);min-height:297mm;margin:16px auto;background:#fff;color:#242E38;padding:12mm;font:12px/1.4 Arial,Helvetica,sans-serif;box-sizing:border-box}
.dohead{display:flex;gap:14px;align-items:flex-start} .dohead .grow{flex:1} .dsm{font-size:10px;color:#7A8691} .dl{font-size:9px;font-weight:700;color:#7A8691}
.dometa{border-collapse:collapse;margin-left:auto;font-size:11px} .dometa td{padding:3px 6px;border-bottom:1px solid #d5dbe0} .dometa td:first-child{font-size:9px;font-weight:700;color:#7A8691} .dometa.w{width:100%;margin-top:6px}
.dsec{font-size:10px;font-weight:700;color:#1FA88A;border-bottom:2px solid #1FA88A;margin:12px 0 4px;padding-bottom:2px}
.do2{display:grid;grid-template-columns:1fr 1fr;gap:16px} .do4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 12px;margin-top:10px} .dv{border-bottom:1px solid #d5dbe0;padding:2px 0;min-height:18px}
.doitems{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px} .doitems th{background:#242E38;color:#fff;text-align:left;padding:5px;font-size:10px} .doitems td{border-bottom:1px solid #d5dbe0;padding:4px 5px;height:18px} .doitems .num{text-align:right} .dotot td{background:#EAF8F4;font-size:10px}
.dsig{height:56px;border-bottom:1px solid #242E38;margin-top:6px}
@media print{body.printing>*:not(#doPrint){display:none!important} #doPrint{position:static;background:#fff;overflow:visible} #doPrint .np{display:none!important} .dopage{margin:0;width:auto;min-height:0;padding:0;max-width:none} @page{size:A4;margin:10mm}}
.lw{display:grid;gap:14px;max-width:760px}
.lwb{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:56px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;font-size:15px}
.lwb.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)} .lwb:disabled{opacity:.45;cursor:default}
.lwgrid,.lwgrid2{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))} .lwgrid .lwb,.lwgrid2 .lwb{flex-direction:column;min-height:110px}
.lwgrid2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.lwlist{display:grid;gap:8px} .lwlist .lwb{justify-content:flex-start;flex-wrap:nowrap} .lwlbl{margin:6px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.lwchips{display:flex;flex-wrap:wrap;gap:8px} .lwchips .lwb{min-width:96px;padding:10px 16px}
.lwpct{display:grid;grid-template-columns:repeat(5,1fr);gap:8px} .lwpct .lwb{padding:10px 4px;font-weight:700}
.lwq{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.lwin{font-size:16px!important;padding:12px!important;width:100%}
.lwfab{display:none}
@media (max-width:760px){.lwfab{display:block;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);width:auto}.lwpad{height:84px}}
.lwbig{font:inherit;font-size:18px;font-weight:700;padding:18px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.lwnav{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;padding:10px 0;background:var(--bg)} .lwnav .btn{min-width:120px;min-height:48px;font-size:16px}
.lwsite{margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev.inv{border-style:dashed;border-left-style:solid;border-left-color:var(--warn);background:var(--warn-bg)} .ev .w{font-size:11.5px;color:var(--muted)}
.ev.Completed{border-left-color:var(--good)} .ev.Cancelled{border-left-color:var(--neutral);opacity:.6;text-decoration:line-through}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding:14px 16px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--sunk);border-radius:10px;padding:8px;display:grid;gap:8px}
.colhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;padding:2px 4px}
.colhead span{font-family:var(--font-num);font-weight:500;color:var(--muted)}
.card{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 10px;cursor:pointer;display:grid;gap:4px}
.card .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.stale{color:var(--bad);font-weight:600}

.wk{display:grid;gap:4px;justify-items:center;align-self:end;font-size:12px;color:var(--muted)}

.fieldset{display:grid;gap:12px}

ol.top3{margin:0;padding-left:20px;display:grid;gap:4px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ================= costing maths ================= */
function landedM2(it){ return n(it.fob) * n(it.fx) * (1 + n(it.sst)/100) + n(it.ship); }
function unitCost(it){
  const w = 1 + n(it.wastage)/100; const c = catOf(it); const so = c === 'supply';
  switch(it.type){
    case 'local':  return n(it.mat)*w + (so ? 0 : n(it.underlay) + n(it.acc) + n(it.install));
    case 'import': { let l = landedM2(it); if(it.unit==='sqft') l = l/SQFT; return l*w + (so ? 0 : n(it.underlay) + n(it.install)); }
    case 'rug':    { const mat = it.rugMode==='pc' ? n(it.pcPrice) : n(it.L)*n(it.W)*landedM2(it); return mat*w + n(it.edging) + (so ? 0 : n(it.install)); }
    case 'labour': return n(it.install) + n(it.underlay) + n(it.acc);
    case 'simple': return n(it.mat) + n(it.install);
    case 'lump':   return n(it.cost);
    case 'disc':   return 0;
  }
  return 0;
}
function itemCalc(it){
  if(it.type==='disc'){ const sell = -Math.abs(n(it.rate)); return {qty:1, uc:0, cost:0, sell, profit:sell, margin:NaN}; }
  const qty = it.type==='lump' ? (n(it.qty) || 1) : n(it.qty); const uc = unitCost(it); const cost = uc*qty; const sell = n(it.rate)*qty;
  return {qty, uc, cost, sell, profit: sell-cost, margin: sell ? (sell-cost)/sell : NaN};
}
function optCalc(o){ let cost=0, sell=0; (o.items||[]).forEach(it => { const c = itemCalc(it); cost+=c.cost; sell+=c.sell; }); return {cost, sell, profit: sell-cost, margin: sell ? (sell-cost)/sell : NaN}; }

function parseNo(raw){ const no = normNo(raw); const m = no.match(/^(.+?)-R(\d+)$/); return m ? {base:m[1], rev:+m[2], full:no} : {base:no, rev:0, full:no}; }
function bindNew(){
  const qi = $('#nq'); if(!qi) return;
  const check = () => {
    const p = parseNo(qi.value); const ex = S.quotes[p.base]; const m = $('#nmsg'); const btn = $('#ncreate');
    if(!p.base){ m.textContent=''; btn.textContent='建立 costing'; return; }
    if(ex && ex.salesperson !== me().name){ m.innerHTML = `<b>${esc(p.base)}</b> 已存在，属于 ${esc(ex.salesperson)}。`; btn.textContent='打开'; return; }
    if(ex && ex.revisions.find(r=>r.rev===p.rev)){ m.innerHTML = `<b>${esc(p.full)}</b> 已存在（${esc(ex.project)} · ${stBadge(ex.revisions.find(r=>r.rev===p.rev).status)}）。会打开原记录。`; btn.textContent = '打开 ' + p.full; }
    else if(ex){ m.innerHTML = `<b>${esc(p.base)}</b> 已存在（最新 ${esc(revNo(ex,latest(ex).rev))}）。会复制最新一版，建立 <b>${esc(p.full)}</b>。`; btn.textContent = '建立 ' + p.full; }
    else { m.textContent = p.rev ? `会建立 ${p.full}（之前的版本没有 costing 记录）。` : ''; btn.textContent = '建立 ' + p.full; }
  };

  $('#ncreate').addEventListener('click', async () => {
    const p = parseNo(qi.value);
    if(!p.base){ $('#nmsg').textContent = '请输入 Quotation No.'; qi.focus(); return; }
    if(['REGISTER','NEW','APPROVAL','ENQUIRY','TEAM'].includes(p.base)){ $('#nmsg').textContent = '这个号码不能用。'; return; }
    const ex = S.quotes[p.base];
    if(ex){
      if(ex.salesperson === me().name && !ex.revisions.find(r=>r.rev===p.rev)){
        const nr = clone(latest(ex)); const from = revNo(ex, nr.rev); nr.rev = p.rev; nr.status='draft'; delete nr.chosen; nr.history=[hist('revised','复制自 '+from)];
        ex.revisions.push(nr); ex.revisions.sort((x,y)=>x.rev-y.rev); await persist(ex); toast('已建立 ' + p.full);
      } else toast(p.full + ' 已存在，已打开原记录');
      S.openNo = p.base; S.rev = p.rev; S.opt = 0; go(p.base); return;
    }
    const q = { quoteNo:p.base, pid: S.newPid || '', project:$('#np').value.trim(), customer:$('#nc').value.trim(), salesperson:me().name, createdBy:S.myId, createdAt:nowIso(), revisions:[ newRev(p.rev) ] };
    q.revisions[0].history.push(hist('created'));

    S.openNo = p.base; S.rev = p.rev; S.opt = 0; go(p.base);

}

  <h2 style="margin:22px 0 8px">最近处理</h2>

function descOf(it){ const d = it.desc || ''; return it.area && !/area\s*:/i.test(d) ? (d ? d + '\n' : '') + 'Area: ' + it.area : d; }

function refreshCalc(){

    const set = (sel, html) => { const el = document.querySelector(sel); if(el) el.innerHTML = html; };

    const mgEl = document.querySelector(`[data-mg="${i}"]`); if(mgEl){ mgEl.textContent = pct(c.margin); mgEl.className = 'num hide-s mg ' + mcls(c.margin); }
    if(it.type==='disc') return;
    const per = ' / ' + (UL[it.unit]||it.unit);
    let lines = [];
    if(it.type==='import' || (it.type==='rug' && it.rugMode!=='pc')){
      const l = landedM2(it);
      lines.push(`Landed <b>${rm(l)}</b> / m²${it.type==='import' && it.unit==='sqft' ? ` = <b>${rm(l/SQFT)}</b> / sqft` : ''}`);
    }
    if(it.type==='rug') lines.push(`${(n(it.L)*n(it.W)).toFixed(2)} m² / pc`);
    const parts = [];
    const add = (lbl, v) => { if(n(v)) parts.push(`${lbl} ${n(v).toFixed(2)}`); };
    const so = catOf(it)==='supply';
    if(it.type==='local'){ parts.push(`供应 ${n(it.mat).toFixed(2)}${n(it.wastage)?` × ${(1+n(it.wastage)/100).toFixed(2)}`:''}`); if(!so){ add('安装', it.install); add('underlay', it.underlay); add('acc', it.acc); } }
    if(it.type==='labour'){ add('labour', it.install); add('underlay', it.underlay); add('acc', it.acc); }
    if(it.type==='simple'){ add(catOf(it)==='labour'?'labour':'material', catOf(it)==='labour'?0:it.mat); add('labour', it.install); }
    if(it.type==='import'){ parts.push(`landed ${(it.unit==='sqft'?landedM2(it)/SQFT:landedM2(it)).toFixed(2)}${n(it.wastage)?` × ${(1+n(it.wastage)/100).toFixed(2)}`:''}`); if(!so){ add('安装', it.install); add('underlay', it.underlay); } }
    lines.push(`成本 ${parts.length>1 ? parts.join(' + ') + ' = ' : ''}<b>${rm(c.uc)}</b>${per} × ${c.qty.toLocaleString('en-MY')} = <b>${rm(c.cost)}</b>`);
    lines.push('建议价 ' + SUG.map(m => { const rec = it.type==='rug' && m===50; return `<span style="${rec?'color:var(--acc)':''}">@${m}% <b>${rm(c.uc/(1-m/100))}</b>${rec?' 推荐':''}</span>`; }).join(' · '));
    set(`[data-calc="${i}"]`, lines.map(x=>`<span>${x}</span>`).join(''));
  });
  const t = optCalc(o);
  const tot = $('#tot'); if(tot) tot.innerHTML = `<div><span>Total cost</span><b>${rm(t.cost)}</b></div><div><span>Quote amount</span><b>${rm(t.sell)}</b></div><div><span>Est. profit</span><b>${rm(t.profit)}</b></div><div><span>Margin</span><b class="mg ${mcls(t.margin)}">${pct(t.margin)}</b></div>`;
  // summary cards
  document.querySelectorAll('.sumc[data-opt]').forEach(el => {
    const op = r.options[+el.dataset.opt]; const c = optCalc(op);
    el.querySelector('.big').textContent = rm0(c.sell);
    const m = el.querySelector('.mg'); m.textContent = pct(c.margin); m.className = 'mg ' + mcls(c.margin);
    const kv = el.querySelectorAll('.kv span'); kv[1].textContent = rm(c.cost); kv[3].textContent = rm(c.profit); kv[5].textContent = op.items.length;
  });
}

function parseSizes(txt){
  const out = [];
  String(txt||'').split(/\n|;|,(?=\s*\d)/).forEach(line => {
    const m = line.replace(/，/g,',').match(/([\d.]+)\s*m?\s*[x×X*]\s*([\d.]+)\s*m?\s*(?:[x×X*@=]|\s)\s*([\d,]+)\s*(?:pcs?|nos?)?/i);
    if(m){ const L = +m[1], W = +m[2], pcs = +String(m[3]).replace(/,/g,''); if(L && W && pcs) out.push({L, W, pcs, m2pc: L*W, m2: L*W*pcs}); }
  });
  return out;
}
const fmt2 = v => n(v).toLocaleString('en-MY',{minimumFractionDigits:2, maximumFractionDigits:2});
function sizesHtml(e){
  const z = parseSizes(e.sizes); if(!z.length) return '<span class="note">每行一个尺寸，例如 <b>1.83x1.5 x 799</b>（长 x 宽 m x 件数）</span>';
  const tp = z.reduce((a,x)=>a+x.pcs,0), tm = z.reduce((a,x)=>a+x.m2,0);
  return `<table class="sz"><thead><tr><th>Size (m)</th><th class="num">m² / pc</th><th class="num">Pcs</th><th class="num">m²</th></tr></thead><tbody>${z.map(x=>`<tr><td>${x.L} × ${x.W}</td><td class="num">${x.m2pc.toFixed(3)}</td><td class="num">${x.pcs.toLocaleString('en-MY')}</td><td class="num">${fmt2(x.m2)}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td></td><td class="num"><b>${tp.toLocaleString('en-MY')}</b></td><td class="num"><b>${fmt2(tm)}</b></td></tr></tbody></table>`;
}
const ENQ_OPEN = {};
const ENQ_FX = {USD:4.5, RMB:0.6024}; const ENQ_SST = 0.10;
function enqLanded(e){ if(!n(e.fob)) return null; const fx = n(e.fx) || ENQ_FX[e.cur] || 0; return n(e.fob) * fx * (1 + ENQ_SST) + n(e.ship); }
function landedHtml(e){ const l = enqLanded(e); if(l == null) return '<span class="note">—</span>'; const u = UL[e.unit] || e.unit; return `<b>RM ${fmt2(l)}</b><span class="note"> / ${esc(u)}</span>${n(e.qty) ? `<div class="note">Total RM ${n(l*n(e.qty)).toLocaleString('en-MY',{maximumFractionDigits:0})}</div>` : ''}`; }
function waText(list){
  const groups = {}; list.forEach(e => { const k = e.supplier || 'Supplier'; (groups[k] = groups[k] || []).push(e); });
  const multi = Object.keys(groups).length > 1;
  return Object.entries(groups).map(([sup, xs]) => `${multi ? '[' + sup + ']\n' : ''}Hi, please quote FOB price:\n` + xs.map((e,i) => { const z = parseSizes(e.sizes); if(!z.length) return `${i+1}. ${e.product}${e.qty ? ' @' + n(e.qty).toLocaleString('en-MY') + (UL[e.unit]||e.unit) : ''}`;
      const tp = z.reduce((a,x)=>a+x.pcs,0), tm = z.reduce((a,x)=>a+x.m2,0);

}

function blankItem(cat, r, source){

  if(type==='local') Object.assign(b, {mat:'', wastage:'', underlay:'', acc:'', install:''});
  if(type==='import') Object.assign(b, {cur:'USD', fob:'', fx:r.fx.USD, sst:r.sst, ship:'', wastage:'', underlay:'', install:''});
  if(type==='rug') Object.assign(b, {unit:'pc', qty:1, rugMode:'fob', L:'', W:'', cur:'USD', fob:'', fx:r.fx.USD, sst:r.sst, ship:'', pcPrice:'', wastage:'', edging:'', install:''});
  if(cat==='install') Object.assign(b, {product:'Installation', link:'', install:'', underlay:'', acc:''});
  if(cat==='transport') Object.assign(b, {unit:'trip', qty:1, cost:'', product:'Transportation'});
  if(cat==='acc') Object.assign(b, {product:'Accessories', mat:'', unit:'pc'});
  if(cat==='sl') Object.assign(b, {product:'Self Levelling', mat:'', install:''});
  if(cat==='labour') Object.assign(b, {product:'Labour', install:'', unit:'day'});

  return b;

/* ---------- client view ---------- */
function clientRows(o){ return o.items.map((it,i) => { const c = itemCalc(it);
  const lines = descOf(it).split('\n').map(x=>x.trim()).filter(Boolean);
  if(it.type==='rug' && n(it.L) && !lines.some(x=>/^size/i.test(x))) lines.push(`Size: ${Math.round(n(it.L)*1000)}mm x ${Math.round(n(it.W)*1000)}mm`);
  return {no:i+1, area:it.area, product:it.product||'', lines, desc:(it.product||'') + (it.type==='rug' && n(it.L) ? ` (${n(it.L)} x ${n(it.W)} m)` : ''), qty:c.qty, unit:UL[it.unit]||it.unit, rate: it.type==='disc' ? -Math.abs(n(it.rate)) : n(it.rate), amt:c.sell}; }); }
const f2 = v => n(v).toLocaleString('en-MY',{minimumFractionDigits:2, maximumFractionDigits:2});
function showClient(q, r, mode){
  mode = mode || (r.options.length > 1 ? 'compare' : 'single');
  const o = r.options[S.opt];
  let body = '', tsv = '';
  if(mode === 'single'){
    const rows = clientRows(o); const total = rows.reduce((s,x)=>s+x.amt,0);
    body = `<table class="zq"><thead><tr><th style="width:56px">S.NO</th><th>ITEM</th><th class="num" style="width:110px">Qty</th><th class="num" style="width:110px">Rate</th><th class="num" style="width:130px">Amount</th></tr></thead>
    <tbody>${rows.map(x=>`<tr><td style="vertical-align:top">${x.no}</td><td style="vertical-align:top"><span style="color:var(--blue);font-weight:500">${esc(x.product)}</span>${x.lines.map(l=>`<div class="zl">${esc(l)}</div>`).join('')}</td><td class="num" style="vertical-align:top">${f2(x.qty)}<div class="note">${esc(x.unit)}</div></td><td class="num" style="vertical-align:top">${f2(x.rate)}</td><td class="num" style="vertical-align:top">${f2(x.amt)}</td></tr>`).join('')}
    <tr><td colspan="4" class="num">total</td><td class="num"><b>MYR${f2(total)}</b></td></tr></tbody></table>`;
    tsv = [['Item','Product & Sku','Description','Qty','Unit','Rate','Amount'].join('\t'), ...rows.map(x=>[x.no,x.product,x.lines.join(' | '),x.qty,x.unit,x.rate.toFixed(2),x.amt.toFixed(2)].join('\t')), ['','','','','','total',total.toFixed(2)].join('\t')].join('\n');
  } else {
    const ops = r.options.map(op => ({op, rows: clientRows(op)}));
    ops.forEach(x => x.total = x.rows.reduce((s,y)=>s+y.amt,0));
    const len = Math.max(...ops.map(x=>x.rows.length));
    const base = ops[0].total;
    let tr = '';
    for(let i=0;i<len;i++){
      tr += `<tr><td>${i+1}</td>${ops.map(x => { const y = x.rows[i]; return y ? `<td style="border-left:1px solid var(--line)">${esc(y.desc)}</td><td class="num">${y.qty.toLocaleString('en-MY')} ${esc(y.unit)}</td><td class="num">${f2(y.rate)}</td><td class="num">${f2(y.amt)}</td>` : '<td style="border-left:1px solid var(--line)" colspan="4"></td>'; }).join('')}</tr>`;
    }
    body = `<div class="sum" style="margin:0 0 14px">${ops.map((x,i)=>`<div class="sumc" style="cursor:default"><div class="k">Option ${esc(x.op.key)}${x.op.label?' · '+esc(x.op.label):''}</div><div class="big">RM ${f2(x.total)}</div><div class="note">${i===0?'Base option':(x.total>=base?'+ ':'– ')+'RM '+f2(Math.abs(x.total-base))+' vs Option '+esc(ops[0].op.key)}</div></div>`).join('')}</div>
    <div style="overflow:auto"><table><thead><tr><th rowspan="2">S.NO</th>${ops.map(x=>`<th colspan="4" style="border-left:1px solid var(--line);text-align:center">OPTION ${esc(x.op.key)}${x.op.label?' · '+esc(x.op.label):''}</th>`).join('')}</tr>
    <tr>${ops.map(()=>`<th style="border-left:1px solid var(--line)">Product</th><th class="num">Qty</th><th class="num">Rate (RM)</th><th class="num">Amount (RM)</th>`).join('')}</tr></thead>
    <tbody>${tr}<tr><td class="num"><b>TOTAL</b></td>${ops.map(x=>`<td colspan="4" class="num" style="border-left:1px solid var(--line)"><b>${f2(x.total)}</b></td>`).join('')}</tr></tbody></table></div>`;
    const head = ['S.NO', ...ops.flatMap(x=>['Option '+x.op.key+' Product','Qty','Unit','Rate (RM)','Amount (RM)'])].join('\t');
    const lines = []; for(let i=0;i<len;i++){ lines.push([i+1, ...ops.flatMap(x=>{ const y=x.rows[i]; return y?[y.desc,y.qty,y.unit,y.rate.toFixed(2),y.amt.toFixed(2)]:['','','','','']; })].join('\t')); }

const loadScript = src => new Promise((ok, bad) => { if(document.querySelector(`script[src="${src}"]`)) return ok(); const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = bad; document.head.appendChild(el); });
async function downloadPdf(el, filename, landscape){
  const btn = $('#dlpdf'); const old = btn.textContent; btn.disabled = true; btn.textContent = '生成中…';
  try{
    const dl = await claude.use('downloads');
    if(!dl){ toast('这个视图不能下载，请在 claude.ai 打开这个页面'); return; }
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
    const pdf = new window.jspdf.jsPDF({ orientation: landscape ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 10;
    const w = pw - 2*m, pxPerMm = canvas.width / w, pageH = Math.floor((ph - 2*m) * pxPerMm);
    for(let y = 0, pg = 0; y < canvas.height; y += pageH, pg++){
      const h = Math.min(pageH, canvas.height - y);
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
      c.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if(pg) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, w, h / pxPerMm);
    }
    await dl.save({ filename, data: pdf.output('blob') });
    toast('PDF 已下载，可以 WhatsApp / email 给客户');
  }catch(e){
    if(e && e.code === 'declined') return;
    console.warn(e); toast(e && e.code ? '下载不成功（' + e.code + '）' : 'PDF 生成失败，请再试一次');
  } finally { btn.disabled = false; btn.textContent = old; }
}

function custRows(){
  const q=S.q.toLowerCase(),qd=S.q.replace(/\D/g,"");
  return db.contacts.filter(seeContact).filter(c=>{
    if(isMgr()&&S.fWho!=="All"&&!c.owners.includes(S.fWho))return false;
    if(S.fType!=="All"&&coType(c)!==S.fType)return false;
    if(S.fStatus==="inactive"&&health(c)!=="inactive")return false;
    if(S.fStatus==="due"&&health(c)==="active")return false;
    if(S.fStatus==="shared"&&c.owners.length<2)return false;
    if(S.fStatus==="new"&&MK(c.createdAt)!==CUR)return false;
    if(q&&!(c.company+" "+c.name).toLowerCase().includes(q)&&!(qd.length>=3&&c.phone.includes(qd)))return false;
    return true}).sort((a,b)=>a.company.localeCompare(b.company)||a.name.localeCompare(b.name));
}

/* ================= COMMISSION ================= */
const paid=p=>(p.payments||[]).reduce((t,x)=>t+x.amount,0);
const r2=v=>Math.round(v*100)/100;
const RULE=()=>{const r=db.commRule||{};return {low:r.low??.30,none:r.none??.20,ownLow:r.ownLow??.015,otherLow:r.otherLow??.01,high:r.high??.45,bonus:r.bonus??.01,late1:r.late1??90,cut1:r.cut1??.25,late2:r.late2??180,cut2:r.cut2??.5}};
/* late collection: commission on money received more than 90 / 120 days after the invoice date is cut 25% / 50% */
const invStart=p=>p.invDate||p.wonAt;
const lateCut=(p,date)=>{const R=RULE(),d=diffDays(date,invStart(p));return d>R.late2?R.cut2:d>R.late1?R.cut1:0};
const marginOf=p=>p.cost&&inv(p)?(inv(p)-p.cost)/inv(p):null;
const pc1=r=>(Math.round(r*1000)/10)+"%";
function commLines(p){
  const R=RULE(),mg=marginOf(p),tier=mg==null?"ok":mg<R.none?"none":mg<R.low?"low":mg>R.high?"high":"ok";
  const base=ACCT[p.acct].rate,rec=paid(p),pct=inv(p)?Math.min(1,rec/inv(p)):0,ready=pct>=.9;
  const owners=p.support&&p.support!==p.passedBy?[p.pic,p.support]:[p.pic];
  const NO_COMM=["Eddie"],FLAT={Vanessa:.01};
  const adj=(r,who)=>tier==="none"?0:tier==="low"?Math.min(r,FLAT[who]!=null?FLAT[who]:p.acct==="own"?R.ownLow:R.otherLow):tier==="high"&&FLAT[who]==null?r+R.bonus:r;
  const note=tier==="none"?` · margin below ${pc1(R.none)}: no commission`:tier==="low"?` · low margin`:tier==="high"?` · high margin bonus +${pc1(R.bonus)}`:"";
  const L=owners.filter(w=>!NO_COMM.includes(w)).map(w=>{const r0=FLAT[w]??base,r=adj(r0,w);
    return {who:w,rate:r,rule:`${FLAT[w]!=null?w+" flat "+pc1(r):ACCT[p.acct].label+" "+pc1(r)}${r!==r0&&(tier==="low"||tier==="high")?" (was "+pc1(r0)+")":""}${owners.length>1?" · ½ share":""}${tier==="high"&&FLAT[w]!=null?"":note}`,full:inv(p)*r/owners.length}});
  if(p.passedBy==="Vanessa"&&!owners.includes("Vanessa")){const r=adj(.01,"Vanessa");L.push({who:"Vanessa",rate:r,rule:`BD overlap ${pc1(r)}${note}`,full:inv(p)*r})}
  L.forEach(l=>{l.p=p;l.rec=rec;l.pct=pct;l.ready=ready;l.low=tier==="low"||tier==="none";l.tier=tier;l.mg=mg;
    l.claimed=(p.claims||[]).filter(c=>c.who===l.who).reduce((t,c)=>t+c.amount,0);
    const iv=inv(p)||1,wv=(p.lateWaive||{})[l.who];l.lost=wv&&wv.status==="Approved"?0:r2((p.payments||[]).reduce((t,y)=>t+Math.min(1,y.amount/iv)*l.full*lateCut(p,y.date),0));l.favour=!!(wv&&wv.status==="Approved");
    l.earned=l.full*pct-l.lost;l.claimable=ready?Math.max(0,r2(l.earned-l.claimed)):0;l.balance=Math.max(0,r2(l.full-l.lost-l.claimed));
    const od=pct<1?diffDays(TODAY,invStart(p)):0,R2=RULE();l.overdue=od;l.nextCut=pct<1&&!l.favour?(od>R2.late2?R2.cut2:od>R2.late1?R2.cut1:0):0;l.daysToCut=pct<1&&od<=R2.late2?(od<=R2.late1?R2.late1-od:R2.late2-od):null});
  return L;
}
function commState(l){

  if(!l.ready)return `<span class="pill warn">Waiting · ${Math.round(l.pct*100)}% paid</span>`;
  return `<span class="pill">Claimed to date · rest after final payment</span>`;
}

function sheetPay(id){

function instSummary(p){

    const claimed=cl.filter(c=>!c.type.startsWith("Deduction")).reduce((t,c)=>t+(+c.claimed||0),0),ded=cl.filter(c=>c.type.startsWith("Deduction")).reduce((t,c)=>t+(+c.claimed||0),0),paid=cl.reduce((t,c)=>t+(+c.paid||0),0),ret=claimed*(+po.retention||0)/100;
    return {po,cl,claimed,ded,paid,ret,due:Math.max(0,claimed-ded-ret-paid),unverified:cl.filter(c=>!c.type.startsWith("Deduction")&&!c.verifiedBy).length}});
}

function printDO(id){const i=db.installs.find(x=>x.id===id),p=projById(i.pid),c=contact(p.cid)||{},office=person(p.officePic||"")||{};
  const rows=(i.lines||[]).filter(l=>+l.qty);if(!rows.length){toast("Add the items on this DO first");sheetInst(id);return}
  const fill=Math.max(0,12-rows.length),tot=rows.reduce((t,r)=>t+(+r.qty||0),0);
  const lbl=t=>`<div class="dl">${t}</div>`,box=(t,v)=>`<div>${lbl(t)}<div class="dv">${esc(v||"")}&nbsp;</div></div>`;
  const html=`<div class="np dobar"><b>DO ${esc(doFull(i))}</b><span class="grow"></span><button class="btn primary" data-act="doPrintNow">Print / Save as PDF</button><button class="btn" data-act="doClose">Close</button></div>
  <div class="dopage"><div class="dohead"><img src="${DO_LOGO}" alt="GQ Projects" style="width:110px"><div class="grow"><div style="font-weight:700;font-size:14px">GQ Projects Sdn Bhd</div><div class="dsm">D-1-13 15, Capital 4, Oasis Square, 2, Jalan PJU 1A/7A,<br>Oasis Damansara, 47301 Petaling Jaya, Selangor<br>t 03 7480 0748 · m 012 2022 905<br>sales@gqprojects.com.my · www.gqprojects.com.my</div></div>
    <div style="min-width:200px"><div style="font-weight:700;font-size:22px;text-align:right">DELIVERY ORDER</div><table class="dometa"><tr><td>DO NO.</td><td><b>${esc(doFull(i))}</b></td></tr><tr><td>DATE</td><td>${fmtDY(i.doDate||i.start)}</td></tr><tr><td>PAGE</td><td>1 of 1</td></tr></table></div></div>
    <div class="do2"><div><div class="dsec">BILL TO</div><div class="dv" style="min-height:52px"><b>${esc(p.company)}</b><br>${esc(p.billAddr||c.n||"")}</div></div><div><div class="dsec">DELIVER TO</div><div class="dv" style="min-height:52px"><b>${esc(p.name)}</b><br>${esc(p.siteAddr||"")}</div></div></div>
    <div class="do4">${box("DELIVERY DATE",fmtDY(i.start))}${box("CLIENT PO NO.",p.loaNo)}${box("GQ JOB / QUOTE NO.",p.mof+(p.quoteNo?" / "+p.quoteNo:""))}${box("SALESPERSON",p.pic)}
      ${box("SITE PIC",p.siteContact)}${box("SITE PIC CONTACT",p.siteNo)}${box("OFFICE PIC",p.officePic)}${box("OFFICE PIC CONTACT",office.phone||"012 2022 905")}</div>
    <table class="doitems"><thead><tr><th style="width:26px">#</th><th>Product</th><th>Item code</th><th>Description</th><th>Batch / lot no.</th><th>Unit</th><th class="num">Qty</th></tr></thead><tbody>
      ${rows.map((r,k)=>`<tr><td>${k+1}</td><td>${esc(r.product)}</td><td>${esc(r.code)}</td><td>${esc(r.desc)}${r.cov?`${r.desc?"<br>":""}<span class="dsm">Qty: ${esc(r.cov)}</span>`:""}</td><td>${esc(r.batch)}</td><td>${esc(r.unit)}</td><td class="num">${(+r.qty).toLocaleString("en-MY")}</td></tr>`).join("")}
      ${"<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>".repeat(fill)}
      <tr class="dotot"><td colspan="5">${rows.length} item line(s)${i.final?" · FINAL DELIVERY":" · PARTIAL DELIVERY"}</td><td><b>TOTAL</b></td><td class="num"><b>${tot.toLocaleString("en-MY")}</b></td></tr></tbody></table>
    <div class="dsec">DELIVERY NOTES · SHORTAGE OR DAMAGE (IF ANY)</div><div class="dv" style="min-height:50px">${esc(i.note||"")}</div>
    <div class="dsec">ACKNOWLEDGEMENT</div><div class="dsm">Goods received in good order and condition, except as noted above.</div>
    <div class="do2" style="margin-top:8px"><div>${lbl("RECEIVED BY (CUSTOMER)")}<div class="dsig"></div><div class="dsm">Signature & company stamp</div><table class="dometa w"><tr><td>NAME</td><td></td></tr><tr><td>DESIGNATION</td><td></td></tr><tr><td>DATE & TIME</td><td></td></tr></table></div>
      <div>${lbl("DELIVERED BY (GQ PROJECTS)")}<div class="dsig"></div><div class="dsm">Signature</div><table class="dometa w"><tr><td>DRIVER NAME</td><td>${esc(i.transporter||"")}</td></tr><tr><td>VEHICLE NO.</td><td></td></tr><tr><td>DATE & TIME</td><td></td></tr></table></div></div>
    <div class="dsm" style="text-align:center;margin-top:14px">Thank you for your business. · GQ Projects Sdn Bhd · 03 7480 0748 · www.gqprojects.com.my</div></div>`;

  if(a==="lvSlip"){sheetEditable=true;openSheet(`<h3>MC · ${esc(l.who)}</h3><p class="hint">${esc(l.type)} · ${lvDates(l)} · uploaded ${fmtD(l.slipAt||l.appliedAt)}</p>${l.slipKind==="pdf"?`<p><a class="btn" href="${l.slipImg}" download="${esc(l.slipName||"MC.pdf")}">Download PDF</a></p>`:`<img src="${l.slipImg}" alt="MC slip" style="width:100%;border-radius:10px;border:1px solid var(--line)">`}<div class="actions">${canApproveLv(l)&&l.status==="Pending"?`<button class="btn primary" data-act="lvApp" data-id="${l.id}">MC checked</button>`:""}<button class="btn" data-act="close">Close</button></div>`);return true}
  if(a==="lvSlipUp"){sheetEditable=true;openSheet(`<h3>Upload MC · ${lvDates(l)}</h3><form class="form" id="f"><label class="field"><span>Photo or PDF of the MC</span><input id="uf" type="file" accept="image/*,application/pdf"></label><div id="up"></div><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="us" ${l.slip?"checked":""}> Original MC slip given to Jany (HR)</label><div id="m"></div>${btnRow("Upload")}</form>`);let sl=null;
    document.getElementById("uf").onchange=async e=>{try{sl=await readSlip(e.target.files[0]);document.getElementById("up").innerHTML=sl&&sl.kind==="img"?`<img src="${sl.img}" alt="MC" style="max-height:160px;border-radius:8px">`:sl?esc(sl.name):""}catch(er){sl=null;msg("m","bad",er)}};
    document.getElementById("f").onsubmit=e=>{e.preventDefault();if(!sl)return msg("m","bad","Choose the photo or PDF first.");Object.assign(l,{slipImg:sl.img,slipName:sl.name,slipKind:sl.kind,slipAt:TODAY,slip:document.getElementById("us").checked});try{save()}catch(er){return msg("m","bad","Storage full in this demo browser. In the real system files are kept on the server.")}closeSheet();render();toast("MC uploaded")};return true}

function sheetHrStaff(n){const p=person(n)||{},st=hrSt(n),H=(st.hist||[]).slice().sort((a,b)=>b.eff.localeCompare(a.eff)),cur=pkgNow(n);sheetEditable=true;let AL=(cur&&cur.allow||[]).map(x=>({...x}));

    <div><b>2 · Performance bonus</b><table style="margin-top:6px"><tbody><tr><td>Below 100% of annual target</td><td>No bonus</td></tr><tr><td>100% to 124%</td><td>1 month basic salary</td></tr><tr><td>125% and above</td><td>3 months basic salary</td></tr></tbody></table><p class="count" style="margin:6px 0 0"><b>Counted on the annual target and paid after year end.</b> Subject to project profitability, payment collection, individual performance, compliance, no unresolved customer/project issues, and management's final approval.</p></div>

function hrPkg(){const L=PEOPLE.filter(p=>p.active!==false&&(["sales","bd","director"].includes(p.role)||p.sells)),Y=CUR.slice(0,4),sc=(db.hrDocs||[]).find(d=>d.scheme&&d.status==="Current");

  ${L.map(p=>{const k=(db.hrPkg||{})[p.n]||{},gg=hrGrades().find(x=>x.g===k.grade),g=gg?[gg.g,gg.annual]:null,ct=annualFull(p.n,Y),bs=pkgNow(p.n)?+pkgNow(p.n).basic:k.basic!=null&&k.basic!==""?+k.basic:gg&&gg.basic,tg=ct||(g&&g[1]),sold=salesNums(Y+"-12",q=>q.pic===p.n||q.support===p.n).ytd,ach=tg?sold/tg:0,bm=ach>=1.25?3:ach>=1?1:0;return `<tr><td class="b">${esc(p.n)}<span class="sub">${esc((p.title||"").split(" ·")[0])}</span></td><td><select class="hrG" data-n="${esc(p.n)}"><option value="">—</option>${HR_GRADES.map(x=>`<option ${k.grade===x[0]?"selected":""}>${x[0]}</option>`).join("")}</select></td><td class="num">${pkgNow(p.n)?`${RM(pkgNow(p.n).basic)}<span class="sub">from staff package</span>`:`<input class="hrB" data-n="${esc(p.n)}" type="number" step="100" min="0" value="${k.basic??""}" placeholder="${gg&&gg.basic?gg.basic:"—"}" style="width:90px;text-align:right" title="Leave empty to use the grade's basic">`}</td><td class="num">${g?RM(g[1]):"—"}</td><td class="num">${ct?RM(ct):"—"}${g&&ct&&ct!==g[1]?`<span class="sub" style="color:var(--warn)">differs from grade</span>`:""}</td><td class="num">${RM(sold)}${tg?`<span class="sub">${Math.round(ach*100)}% of target</span>`:""}</td><td class="num">${!tg?"—":bm?`<b>${bm} month${bm>1?"s":""}</b>${bs?`<span class="sub">≈ ${RM(bm*bs)}</span>`:""}${bm===1?`<span class="sub">${RM(tg*1.25-sold)} more to 3 months</span>`:""}`:`<span class="count">no bonus yet</span><span class="sub">${RM(tg-sold)} more to 1 month</span>`}</td><td><input type="date" class="hrA" data-n="${esc(p.n)}" value="${k.ack||""}"><span class="sub">${k.ack?(k.ackVer&&sc&&k.ackVer!==sc.ver?`<span style="color:var(--warn)">signed version ${esc(k.ackVer)} – needs the new one</span>`:"version "+esc(k.ackVer||"")):`<span class="stale">not signed</span>`}</span></td><td><input class="hrN" data-n="${esc(p.n)}" value="${esc(k.note||"")}" placeholder="e.g. promoted S1 → S2 from Jan 2027"></td></tr>`}).join("")}</tbody></table></div>

function hrClick(a,t){const id=+t.dataset.id;

  if(a==="hrAdd"){sheetHrDoc();return true}
  if(a==="hrOsEdit"){sheetHrOs();return true}
  if(a==="hrStdEdit"){sheetHrStd(t.dataset.k);return true}
  if(a==="hrStEdit"){sheetHrStaff(t.dataset.n);return true}
  if(a==="hrEdit"){sheetHrDoc(id);return true}
  if(a==="hrOpen"){const d=db.hrDocs.find(x=>x.id===id);if(d&&d.file){const w=window.open("","_blank");if(w)w.document.write(`<title>${esc(d.title)}</title>${d.file.kind==="pdf"?`<iframe src="${d.file.img}" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>`:`<img src="${d.file.img}" style="max-width:100%">`}`)}return true}
  if(a==="hrRule"){sheetEditable=true;openSheet(`<h3>Add a rule</h3><form class="form" id="f"><label class="field"><span>Rule *</span><textarea id="hrRu" rows="3"></textarea></label><label class="field"><span>From</span><input id="hrRd" type="date" value="${TODAY}"></label><div id="m"></div>${btnRow("Add")}</form>`);
    document.getElementById("f").onsubmit=e=>{e.preventDefault();if(!val("hrRu"))return msg("m","bad","Write the rule.");db.hrExtra=db.hrExtra||[];db.hrExtra.push({id:++db.seq,date:val("hrRd")||TODAY,rule:val("hrRu"),by:me});save();closeSheet();render()};return true}
  if(a==="hrRuleDel"){db.hrExtra=db.hrExtra.filter(x=>x.id!==id);save();render();return true}

function coCheck(name,who){const x=coAcct(name);if(!x)return {ok:true,html:""};
  if(x.owners.includes(who)||isMgr())return {ok:true,html:`<div class="msg info">${esc(x.name)} is assigned to <b>${x.owners.join(" + ")}</b>.</div>`};
  return {ok:false,html:`<div class="msg bad"><b>${esc(x.name)}</b> is assigned to <b>${x.owners.join(" + ")}</b>. Only they can add contacts there. Ask Eddie or Vicky if you should handle this firm.</div>`}}
function findDup(phone){
  const p=normPhone(phone);
  return p.length>=9?db.contacts.find(c=>c.phone===p):null;
}
function sheetAddCust(co0){
  openSheet(`<h3>Add customer</h3><p class="hint">Pick the company first, then the person. The person's mobile number decides ownership.</p>
  <form class="form" id="f">
    <label class="field"><span>Company *</span><input id="co" required list="coList" value="${esc(co0||"")}" placeholder="Start typing, pick an existing company"></label>
    <datalist id="coList">${(db.companies||[]).map(x=>`<option value="${esc(x.name)}">`).join("")}</datalist>
    <label class="field"><span>Company type</span><select id="ct">${opts(CTYPES,"Designer")}</select><small id="ctH" class="hint" style="margin:0"></small></label>
    <label class="field"><span>Customer name *</span><input id="nm" required></label>
    <div class="row2"><label class="field"><span>Contact (mobile) *</span><input id="ph" inputmode="tel" required placeholder="012-345 6789"></label><label class="field"><span>Position</span><input id="ti" placeholder="e.g. Senior Designer"></label></div>
    <div id="dup"></div>
    <label class="field"><span>Company rating</span><select id="ra">${opts(Object.entries(RATING).map(([k,v])=>[k,k+" · "+v]),"3")}</select></label>
    ${isMgr()?ownerFields({owners:[SALES[0]],acct:"own",passedBy:""}):`<p class="hint" style="margin:0">Saved under <b>${me}</b> as an own-effort account, registered ${fmtDY(TODAY)}.</p>`}
    <label class="field"><span>Notes</span><input id="no"></label>
    <div id="m"></div>${btnRow("Save customer")}</form>`);
  const chk=()=>{const d=findDup(val("ph"));
    if(!d){msg("dup","",val("ph").replace(/\D/g,"").length>=9?"✓ New number. You will own this contact.":"");if(val("ph").replace(/\D/g,"").length>=9)document.querySelector("#dup .msg").className="msg good";return null}
    const mine=d.owners.includes(me);
    document.getElementById("dup").innerHTML=`<div class="msg ${mine?"warn":"bad"}">${mine?`You already have this contact: <b>${esc(d.name)}</b>, ${esc(d.company)}.`:`This number belongs to a contact registered by <b>${d.owners.join(" + ")}</b> on ${fmtDY(d.createdAt)}. You can't add it again.`}
      ${!mine&&!isMgr()?`<div style="margin-top:8px;display:grid;gap:6px"><input id="rq" placeholder="Why should you handle this customer?"><button type="button" class="btn small" data-act="sendReq" data-id="${d.id}">Ask director to review</button></div>`:""}${isMgr()&&!mine?` <button type="button" class="btn small" data-act="owner" data-id="${d.id}">Open and reassign</button>`:""}</div>`;
    return d};
  document.getElementById("ph").addEventListener("input",chk);
  const coT=()=>{const x=coRec(val("co")),sel=document.getElementById("ct"),ra=document.getElementById("ra");if(x){sel.value=x.type;ra.value=String(x.rating||3);sel.disabled=ra.disabled=true;document.getElementById("ctH").textContent="Existing company · type and rating are set on the company"}else{sel.disabled=ra.disabled=false;document.getElementById("ctH").textContent=val("co")?"New company":""}};
  document.getElementById("co").addEventListener("input",coT);coT();
  document.getElementById("co").addEventListener("change",()=>{const cc=coCheck(val("co"),me);if(cc.html){document.getElementById("m").innerHTML=cc.html;return}const n=db.contacts.filter(c=>coKey(c.company)===coKey(val("co")));if(n.length)msg("m","warn",`${esc(val("co"))} already has ${n.length} contact${n.length>1?"s":""} in the system. A different person at the same company is fine.`)});
  document.getElementById("f").onsubmit=e=>{e.preventDefault();
    if(chk())return;
    {const cc=coCheck(val("co"),me);if(!cc.ok){document.getElementById("m").innerHTML=cc.html;return}}
    if(normPhone(val("ph")).length<10)return msg("m","bad","Enter a full Malaysian mobile number, e.g. 012-345 6789.");
    let o={owners:[me],acct:"own",passedBy:""};
    if(isMgr()){o=readOwners();if(o.err)return msg("m","bad",o.err)}
    {const x=coRec(val("co"));if(!x)db.companies.push({id:++db.seq,name:val("co").trim(),type:val("ct"),rating:+val("ra"),acct:"",owners:[]})}
    db.contacts.push({id:++db.seq,company:(coRec(val("co"))||{}).name||val("co"),name:val("nm"),phone:normPhone(val("ph")),title:val("ti"),ctype:val("ct"),rating:+val("ra"),...o,createdBy:me,createdAt:TODAY,notes:val("no")});
    save();closeSheet();render();toast("Customer saved");
  };
}
function ownerFields(c){
  return `<div class="row2"><label class="field"><span>Salesperson 1</span><select id="o1">${opts(TF(),c.owners[0])}</select></label>
    <label class="field"><span>Salesperson 2 (shared)</span><select id="o2">${opts(TF(),c.owners[1],"— none —")}</select></label></div>
  <div class="row2"><label class="field"><span>Account type</span><select id="ac">${opts(Object.entries(ACCT).map(([k,v])=>[k,v.label+" · "+v.rate*100+"%"]),c.acct)}</select></label>
    <label class="field"><span>Passed down by</span><select id="pb">${opts(PASSERS,c.passedBy,"—")}</select></label></div>`;
}
function readOwners(){
  const o1=val("o1"),o2=val("o2"),ac=val("ac"),pb=val("pb");
  if(o2&&o2===o1)return{err:"Salesperson 1 and 2 must be different people."};
  if(ac==="pass"&&!pb)return{err:"Choose who passed this account down."};
  return{owners:o2?[o1,o2]:[o1],acct:ac,passedBy:ac==="pass"?pb:""};
}
function sheetCust(id){
  const c=contact(id);const acts=db.acts.filter(a=>metIds(a).includes(id)&&a.status!=="Cancelled").sort((a,b)=>b.date.localeCompare(a.date));
  const projs=db.projects.filter(p=>p.cid===id);const log=db.log.filter(l=>l.cid===id);
  openSheet(`<h3>${esc(c.name)}</h3><p class="hint">${esc(c.title||"")}${c.title?" · ":""}${(()=>{const x=coRec(c.company);return x?`<a href="#" data-act="coView" data-id="${x.id}">${esc(c.company)}</a>`:esc(c.company)})()}</p>
    <dl class="kv"><dt>Contact</dt><dd class="mono">${fmtPhone(c.phone)}</dd><dt>Position</dt><dd>${esc(c.title||"—")}</dd>
    <dt>Company type</dt><dd>${esc(coType(c))}</dd><dt>Company rating</dt><dd>${coRating(c)} ${RATING[coRating(c)]}</dd>${(()=>{const x=coAcct(c.company);return x?`<dt>Assigned to</dt><dd>${x.owners.join(" + ")}</dd>`:""})()}<dt>Owner</dt><dd>${c.owners.join(" + ")} ${acctPill(c)}</dd>
    <dt>Registered</dt><dd>${fmtDY(c.createdAt)} by ${c.createdBy}</dd><dt>Last activity</dt><dd>${fmtDY(lastActive(c))} ${healthPill(c)}${(()=>{const v=activeVia(c);return v.cid!==c.id?`<span class="sub">Via ${esc(v.who)}'s visit to ${esc(contact(v.cid).name)} at the same company. Any visit to ${esc(c.company)} keeps all of ${esc(v.who)}'s contacts there active.</span>`:""})()}</dd></dl>
    ${(()=>{const same=db.contacts.filter(x=>x.id!==c.id&&coKey(x.company)===coKey(c.company)&&((isMgr()&&tmC(x))||x.owners.some(o=>c.owners.includes(o))));if(!same.length)return "";
      const by={};same.forEach(x=>x.owners.forEach(o=>(by[o]=by[o]||[]).push(x)));
      return `<div class="sec">Others at ${esc(c.company)} (${same.length})</div><div class="hist">${Object.entries(by).map(([o,L])=>`<div><b>${esc(o)}</b> · ${L.length} contact${L.length>1?"s":""}<span class="sub">${L.map(x=>esc(x.name)+(x.title?" ("+esc(x.title)+")":"")).join(", ")}</span></div>`).join("")}</div>`})()}
    <div class="actions" style="justify-content:flex-start;margin-top:12px">${c.owners.includes(me)?`<button class="btn small" data-act="addAct" data-cid="${c.id}" data-type="Call">📞 Plan a call</button><button class="btn small primary" data-act="addAct" data-cid="${c.id}">Log / plan visit</button>`:""}${isMgr()?`<button class="btn small" data-act="owner" data-id="${c.id}">Change owner</button>`:""}</div>
    ${projs.length?`<div class="sec">Projects</div><div class="hist">${projs.map(p=>`<div>${esc(p.name)} · ${p.stage} · ${RMk(p.value)}</div>`).join("")}</div>`:""}
    <div class="sec">Activity (${acts.length})</div><div class="hist">${acts.slice(0,8).map(a=>`<div><b>${fmtDY(a.date)}</b> · ${a.who} · ${a.type}${metIds(a).length>1?" · with "+esc(metIds(a).filter(i=>i!==id).map(i=>(contact(i)||{}).name).join(", ")):""}${a.status==="Planned"?" (planned)":""}<span class="sub">${esc(a.purpose)}${a.outcome?" → "+esc(a.outcome):""}</span></div>`).join("")||"<div>None yet</div>"}</div>
    ${log.length?`<div class="sec">Ownership history</div><div class="hist">${log.map(l=>`<div><b>${fmtDY(l.at)}</b> · ${l.from.join(" + ")} → ${l.to.join(" + ")} by ${l.by}<span class="sub">${esc(l.reason)}</span></div>`).join("")}</div>`:""}
    <div class="actions"><button class="btn" data-act="close">Close</button></div>`);
}
function sheetOwner(id,reqId){
  const c=contact(id),req=reqId&&db.requests.find(r=>r.id===reqId);
  const pre=req?{...c,owners:[req.from]}:c;
  openSheet(`<h3>Change owner · ${esc(c.name)}</h3><p class="hint">${esc(c.company)} · now ${c.owners.join(" + ")} · last activity ${fmtDY(lastActive(c))} (${idle(c)} days ago)</p>
    ${req?`<div class="msg warn" style="margin-bottom:12px"><b>${req.from}'s request:</b> ${esc(req.reason)}</div>`:""}
    <form class="form" id="f">${ownerFields(pre)}
      <label class="field"><span>Reason *</span><input id="rs" required value="${req?`Request from ${req.from}`:health(c)==="inactive"?`No activity for ${idle(c)} days`:""}"></label>
      <div id="m"></div>
      <div class="actions">${req?`<button type="button" class="btn danger" data-act="rejectReq" data-id="${req.id}">Keep with ${c.owners.join(" + ")}</button>`:""}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save change</button></div></form>`);
  document.getElementById("f").onsubmit=e=>{e.preventDefault();
    const o=readOwners();if(o.err)return msg("m","bad",o.err);
    if(!val("rs"))return msg("m","bad","Add a reason. It is kept in the ownership history.");
    db.log.push({cid:c.id,from:[...c.owners],to:o.owners,by:me,at:TODAY,reason:val("rs")});
    Object.assign(c,o);if(req)req.status="Approved";save();closeSheet();render();toast("Owner updated");
  };
}
const invCands=who=>PEOPLE.filter(p=>p.active!==false&&p.n!==who&&p.n!==me&&["sales","bd","director","md"].includes(p.role)).sort((a,b)=>({md:0,director:1,bd:2,sales:3}[a.role]-{md:0,director:1,bd:2,sales:3}[b.role])||a.n.localeCompare(b.n)).map(p=>p.n);
function clashFor(a,n){return db.acts.filter(x=>x.id!==a.id&&x.status!=="Cancelled"&&x.date===a.date&&x.time===a.time&&actIs(x,n))}
function invSection(a){const L=invOf(a),mine=a.who===me||role()==="md",my=invFor(a,me);
  const pill=st=>`<span class="pill ${st==="Accepted"?"good":st==="Declined"?"bad":"warn"}">${st==="Pending"?"Waiting for reply":st}</span>`;
  let h=L.length?`<div class="field" style="margin-top:12px"><span>Going together</span><div style="display:grid;gap:6px">${L.map(i=>`<div style="display:flex;gap:8px;align-items:center"><b>${esc(i.n)}</b>${pill(i.st)}${i.note?`<small class="count">${esc(i.note)}</small>`:""}</div>`).join("")}</div></div>`:"";
  if(my&&my.st==="Pending"&&a.status==="Planned"){const cl=clashFor(a,me);
    h+=`<div class="banner ${cl.length?"bad":"info"}" style="margin-top:12px"><div class="grow"><b>${esc(a.who)} invited you to join.</b> ${cl.length?`You already have ${esc(contact(cl[0].cid).company)} at ${a.time} that day.`:"You are free at this time."} Accept to put it in your calendar.</div></div>
      <div class="actions"><button class="btn danger" data-act="invDec" data-id="${a.id}">Can't go</button><button class="btn primary" data-act="invAcc" data-id="${a.id}">Accept</button></div>`}
  else if(my&&my.st==="Accepted"&&a.status==="Planned"&&a.who!==me)h+=`<div class="actions"><button class="btn small ghost" data-act="invDec" data-id="${a.id}">Can't go anymore</button></div>`;
  if(mine&&a.status==="Planned"&&a.date>=TODAY){const C=invCands(a.who).filter(n=>!invFor(a,n)||invFor(a,n).st==="Declined");
    if(C.length)h+=`<div class="toolbar" style="padding:10px 0 0;border:0"><select id="invAddN" aria-label="Invite colleague">${C.map(n=>`<option>${esc(n)}</option>`).join("")}</select><button class="btn small" data-act="invAdd" data-id="${a.id}">+ Invite to go together</button></div>`}
  return h}

/* ===== Visit outcome log + weekly deadline (Fri) + Monday sales meeting ===== */
const VIS_RESULTS=["Introduced GQ / new contact","Presented products","Sample requested","Quotation requested","Specified our product","Order confirmed","Follow up later","Not interested"];
const wkDueT=()=>(db.remind&&db.remind.wk&&db.remind.wk.due)||"18:00";
const friOf=d=>addDays(mondayOf(d),4);
const wkDueTs=d=>friOf(d)+"T"+wkDueT();
const needsOut=a=>a.status==="Planned"&&a.date<=TODAY;
const outMissing=who=>db.acts.filter(a=>a.who===who&&needsOut(a)).sort((x,y)=>x.date.localeCompare(y.date));
const nowTs=()=>{const n=NOWKL();return n.slice?n:TODAY+"T12:00"};
function outBlock(a={}){const L=a.lead||{};return `<div class="field"><span>Result *</span><select id="ores">${opts(["",...VIS_RESULTS].map(x=>[x,x||"Choose…"]),a.result||"")}</select></div>
  <label class="field"><span>What did you learn about the company? * <small style="font-weight:400">Who decides, new projects, competitors, budget, timing…</small></span><textarea id="ou" rows="3" placeholder="e.g. Met Joyce (ID). They are doing 2 offices in Q1, about 3,000 m². Using Interface now, open to switch if price OK.">${esc(a.outcome||"")}</textarea></label>
  <details ${L.name?"open":""}><summary class="count" style="cursor:pointer">+ Project lead from this visit (optional)</summary><div style="display:grid;gap:8px;margin-top:8px"><label class="field"><span>Project name</span><input id="oln" value="${esc(L.name||"")}" placeholder="e.g. Menara ABC L12 office"></label><div class="row2"><label class="field"><span>Est. value (RM)</span><input id="olv" type="number" min="0" value="${esc(String(L.value||""))}"></label><label class="field"><span>Expected start</span><input id="olw" type="month" value="${esc(L.when||"")}"></label></div></div></details>
  <div class="row2"><label class="field"><span>Next step</span><input id="na" placeholder="e.g. Send quotation"></label><label class="field"><span>Next follow-up date</span><input id="nd" type="date"></label></div>`}
function readOut(){const r=val("ores"),o=val("ou").trim();if(!r)return {err:"Choose the result of the visit."};if(o.length<15)return {err:"Write what you learned about the company (at least one sentence)."};
  const ln=(document.getElementById("oln")||{}).value||"";return {result:r,outcome:o,lead:ln.trim()?{name:ln.trim(),value:+val("olv")||0,when:val("olw")}:null,next:val("na"),nextDate:val("nd")}}
function applyOut(a,o){Object.assign(a,{status:"Completed",result:o.result,outcome:o.outcome,loggedAt:TODAY,loggedTs:nowTs(),...(o.lead?{lead:o.lead}:{}),...(o.next?{nextStep:o.next}:{})});
  if(a.loggedTs>wkDueTs(a.date))a.lateLog=true;
  if(o.nextDate)db.acts.push({id:++db.seq,date:o.nextDate,time:"10:00",who:a.who,cid:a.cid,met:[],type:"Visit",purpose:o.next||"Follow-up",status:"Planned",outcome:""})}
function callBanner(){if(!["sales","bd","director","md"].includes(role()))return "";const C=db.acts.filter(a=>a.who===me&&a.type==="Call"&&a.status==="Planned"&&a.date===TODAY).sort((x,y)=>x.time.localeCompare(y.time));if(!C.length)return "";
  return `<div class="banner info"><div class="grow"><b>📞 ${C.length} call${C.length>1?"s":""} to make today:</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${C.map(a=>{const c=contact(a.cid);return `<button class="btn small" data-act="act" data-id="${a.id}">${a.time} · ${esc(c.name)} (${esc(c.company)})${c.phone?" · "+esc(c.phone):""}</button>`}).join("")}</div><span class="count">Tap one after the call to record the outcome.</span></div></div>`}
function outBanner(){if(!["sales","bd","director","md"].includes(role()))return "";const M=outMissing(me);if(!M.length)return "";const late=M.filter(a=>nowTs()>wkDueTs(a.date)).length;
  return `<div class="banner ${late?"bad":"warn"}"><div class="grow"><b>${M.length} visit${M.length>1?"s":""} without outcome</b> · log them, then submit your weekly report to Eddie · due Fri ${fmtD(friOf(M[M.length-1].date))}, ${fmtT(wkDueT())}${late?` · <b>${late} overdue</b>`:""}<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${M.slice(0,6).map(a=>`<button class="btn small" data-act="act" data-id="${a.id}">${fmtD(a.date)} · ${esc(contact(a.cid).company)}</button>`).join("")}</div></div></div>`}
const wrep=(n,wk)=>((db.wreports||{})[n+"|"+wk]);
function wkSubmitBox(wk){const r=wrep(me,wk),miss=db.acts.filter(a=>a.who===me&&a.date>=wk&&a.date<=addDays(wk,6)&&needsOut(a)),due=wkDueTs(wk);
  if(r)return `<div class="banner ${r.status==="Reviewed"?"good":"info"}"><div class="grow"><b>Weekly report ${r.status==="Reviewed"?"reviewed by "+esc(r.reviewedBy):"submitted to "+esc(leadOf(me)||"Eddie")}</b> · ${fmtD(r.at.slice(0,10))} ${r.at.slice(11,16)}${r.late?` · <span class="stale">after the Friday deadline</span>`:""}${r.note?`<div style="margin-top:4px">${esc(r.note)}</div>`:""}${r.revNote?`<div class="count">Eddie: ${esc(r.revNote)}</div>`:""}</div></div>`;
  if(wk>mondayOf(TODAY))return "";
  return `<section class="panel"><div class="panel-head"><h2>Submit this week to ${esc(leadOf(me)||"Eddie")}</h2><span class="count">Due Fri ${fmtD(friOf(wk))}, ${fmtT(wkDueT())} · weekly meeting Mon ${fmtD(addDays(wk,7))}</span></div><div class="panel-body" style="display:grid;gap:10px">
    ${miss.length?`<div class="msg bad">Log the outcome of ${miss.length} visit${miss.length>1?"s":""} first: ${miss.map(a=>`<a href="#" data-act="act" data-id="${a.id}">${fmtD(a.date)} ${esc(contact(a.cid).company)}</a>`).join(", ")}</div>`:""}
    <label class="field"><span>Key points for Monday's meeting (optional)</span><textarea id="wkNote" rows="2" placeholder="e.g. 2 quotations out, need Eddie to join the Kayu presentation"></textarea></label>
    <div class="actions" style="justify-content:flex-start"><button class="btn primary" data-act="wkSubmit" data-v="${wk}" ${miss.length?"disabled":""}>Submit weekly report to ${esc(leadOf(me)||"Eddie")}</button></div></div></section>`}
function calWeekly(){const wk=S.wkW||(()=>{const w=dow(TODAY);return [0,6,1].includes(w)?addDays(mondayOf(TODAY),w===1?-7:(w===0?-6:0)):mondayOf(TODAY)})();
  const end=addDays(wk,6),due=wkDueTs(wk),T=(isMgr()?TF():[me]).filter(n=>person(n)&&person(n).active!==false);
  const A=db.acts.filter(a=>a.date>=wk&&a.date<=end&&a.status!=="Cancelled");
  const rows=T.map(n=>{const L=A.filter(a=>a.who===n),done=L.filter(a=>a.status==="Completed"),miss=L.filter(a=>a.status==="Planned"&&a.date<=TODAY),late=done.filter(a=>a.lateLog),leads=done.filter(a=>a.lead);
    const vis=done.filter(a=>VISIT_TYPES.includes(a.type)).length;
    return {n,L,done,miss,late,leads,vis,val:leads.reduce((t,a)=>t+(a.lead.value||0),0),rep:wrep(n,wk)}});
  const open=S.wkOpen||"";
  return `<section class="panel"><div class="toolbar"><button class="btn small" data-act="wkW" data-d="-7" aria-label="Previous week">‹</button><b style="min-width:170px;text-align:center">${fmtD(wk)} – ${fmtDY(end)}</b><button class="btn small" data-act="wkW" data-d="7" aria-label="Next week">›</button>
    <span class="count">Outcomes due <b>Fri ${fmtD(friOf(wk))}, ${fmtT(wkDueT())}</b> · reviewed at the Monday sales meeting ${fmtD(addDays(wk,7))}</span></div>
